name = "moscowtab"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = true

# Свой домен: зона trydokli.ru делегирована на Cloudflare.
routes = [
  { pattern = "trydokli.ru", custom_domain = true }
]

# Собранный React отдаётся тем же воркером: один домен, никакого CORS.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"

[vars]
SHOP_NAME = "MoscowTab"
ADMIN_IDS = "7500381413"
ORDER_CHAT_ID = ""
# Адрес Mini App: бот ставит кнопку «Магазин» каждому при /start.
# Временно на workers.dev: адреса 188.114.x, выданные зоне trydokli.ru,
# не проходят у части сетей. Вернуть домен, когда переедет на другие IP.
MINI_APP_URL = "https://moscowtab.moscowtab.workers.dev"

# BOT_TOKEN хранится как секрет: npx wrangler secret put BOT_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "moscowtab"
database_id = "6a592dd7-880d-44a1-b85c-e9331e51887f"
