name = "moscowtab"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = true

# Свой домен: зона trydokli.ru делегирована на Cloudflare.
routes = [
  { pattern = "trydokli.ru", custom_domain = true }
]

# Собранный React отдаётся тем же воркером: один домен, никакого CORS.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"

[vars]
SHOP_NAME = "MoscowTab"
ADMIN_IDS = "7500381413,1141664845"
ORDER_CHAT_ID = ""
# Имя бота без «@»: корзина по нему уводит в чат, когда бот не смог написать сам.
BOT_USERNAME = "moscowtabot"
# Адрес Mini App: бот ставит кнопку «Магазин» каждому при /start.
# Имя trydokli.ru фильтруется по SNI у российских провайдеров — вместе со всеми
# поддоменами, поэтому приложение живёт на workers.dev. Домен оставлен
# привязанным: вернуть его — поменять эту строку.
MINI_APP_URL = "https://moscowtab.moscowtab.workers.dev"

# BOT_TOKEN хранится как секрет: npx wrangler secret put BOT_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "moscowtab"
database_id = "6a592dd7-880d-44a1-b85c-e9331e51887f"
